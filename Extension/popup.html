<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg:#ffffff; --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb; --blue:#2563eb;
            --red:#dc2626; --green:#059669; --chip:#f3f4f6; }
    body { font-family: -apple-system, Segoe UI, Arial, sans-serif; width: 420px; margin: 0;
           background: var(--bg); color: var(--fg); font-size: 13px; }
    header { padding: 12px 14px; border-bottom: 1px solid var(--line); display:flex;
             align-items:center; justify-content:space-between; }
    .brand { font-weight: 700; color: var(--blue); letter-spacing: .3px; }
    #serverDot { font-size: 11px; color: var(--muted); }
    .body { padding: 12px 14px; }
    button { font: inherit; padding: 8px 14px; border-radius: 7px; border: none; cursor: pointer; }
    .primary { background: var(--blue); color: #fff; }
    .primary:disabled { background: #93c5fd; cursor: not-allowed; }
    .ghost { background: var(--chip); color: var(--fg); }
    .row { display:flex; gap:8px; align-items:center; }
    .muted { color: var(--muted); font-size: 12px; }
    .status { margin: 10px 0; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
    .dot.live { background: var(--red); animation: pulse 1.2s infinite; }
    .dot.idle { background: #9ca3af; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .results { margin-top: 10px; max-height: 320px; overflow:auto; }
    .finding { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:7px; }
    .finding.vuln { border-color:#fecaca; background:#fef2f2; }
    .finding .top { display:flex; justify-content:space-between; gap:8px; }
    .finding .ep { font-family: ui-monospace, monospace; font-size:11px; color:var(--muted); word-break:break-all; }
    .badge { font-size:10px; padding:2px 7px; border-radius:10px; white-space:nowrap; }
    .badge.vuln { background:var(--red); color:#fff; }
    .badge.safe { background:#e5e7eb; color:#374151; }
    .tag { font-size:11px; color:var(--fg); }
    .copy { font-family: ui-monospace, monospace; background:var(--chip); padding:2px 6px; border-radius:4px; }
    .hint { background:#fffbeb; border:1px solid #fde68a; padding:8px 10px; border-radius:7px; margin:8px 0; }
    .sum { font-weight:600; margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">EthicalQuoc</div>
    <div id="serverDot">checking server…</div>
  </header>
  <div class="body">
    <div id="hint" class="hint" style="display:none;">
      Local server not reachable. Start it first:
      <div style="margin-top:6px;"><span class="copy">python main.py serve</span></div>
    </div>

    <div class="status">
      <span id="capDot" class="dot idle"></span>
      <span id="capText">Idle — ready to capture.</span>
      <span id="capCount" class="muted"></span>
    </div>

    <div class="row">
      <button id="startBtn" class="primary">Start capture</button>
      <button id="completeBtn" class="primary" disabled>Complete</button>
      <button id="cancelBtn" class="ghost" style="display:none;">Cancel</button>
    </div>
    <div class="muted" style="margin-top:8px;">
      Click <b>Start</b>, use the site normally, then <b>Complete</b> to scan.
    </div>

    <div class="row" style="margin-top:10px;">
      <input id="oobInput" type="text" autocomplete="off" spellcheck="false"
             placeholder="OOB domain (optional) — e.g. abc123.oastify.com"
             style="flex:1; padding:7px 9px; border:1px solid var(--line); border-radius:7px; font:inherit; color:var(--fg); background:var(--bg);">
    </div>
    <div class="muted" style="margin-top:4px;">
      For blind confirmation (URLDNS / SSRF canary). Leave empty to use config.json.
    </div>

    <div id="summary" class="sum" style="display:none;"></div>
    <div id="reportRow" class="row" style="display:none; margin:6px 0 2px;">
      <button id="reportBtn" class="ghost">View full report</button>
      <button id="downloadBtn" class="ghost">Download JSON</button>
    </div>
    <div id="results" class="results"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
